.hum .bar .yt, .hum .legend .yt { background: var(--h-ink-2); }
.hum .bar .nf, .hum .legend .nf { background: var(--h-mint-deep); }
.hum .bar i:last-child { border-radius: 8px 8px 0 0; }
.hum .days .today { color: var(--h-ink); font-weight: 600; }
.h-log { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.h-log li { display: grid; grid-template-columns: 4.5rem minmax(0, 1fr); gap: 10px; padding: 10px 14px; background: var(--h-card); border-radius: 16px; box-shadow: var(--h-shadow); font-size: 0.9375rem; }
.h-log time { color: var(--h-muted); font-size: 0.875rem; }
.h-log b { color: var(--h-ink); font-weight: 600; }
.h-more summary { cursor: pointer; padding: 10px 0; min-height: 44px; color: var(--h-blue); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; list-style: none; }
.h-me { margin: 0; color: var(--h-muted); font-size: 0.875rem; }
.note { margin: 0; font-size: 0.875rem; }
.coral .note { color: var(--c-accent-2); }
.ink .note { color: var(--i-accent-soft-ink); }
.hum .note { color: var(--h-blue); }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="press"><feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="1" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2"/></filter></svg>

<div class="wrap">
  <div class="intro">
    <h1>家長頁新樣式：三種調性</h1>
    <p>用 hallmark 做的 mock，所有數字都是範例。按鈕可以按，加時間後約 2 秒「電視收到」。</p>
  </div>
  <div class="ctl">
    <div class="ctl-group tabs-group"><span class="ctl-label" id="lt">調性</span>
      <div class="seg" role="group" aria-labelledby="lt" id="tabs">
        <button type="button" data-tab="coral" aria-pressed="true">溫暖柔和</button>
        <button type="button" data-tab="ink" aria-pressed="false">簡潔工具感</button>
        <button type="button" data-tab="hum" aria-pressed="false">活潑</button>
      </div>
    </div>
    <div class="ctl-group"><span class="ctl-label" id="ls">範例狀態</span>
      <div class="seg" role="group" aria-labelledby="ls" id="modes">
        <button type="button" data-mode="open" aria-pressed="true">開放中</button>
        <button type="button" data-mode="done" aria-pressed="false">時間用完</button>
        <button type="button" data-mode="lost" aria-pressed="false">電視失聯</button>
      </div>
    </div>
  </div>
  <div class="mocks">
    <div class="col" data-col="coral"><p class="mock-name">溫暖柔和（Coral）</p><section class="mock coral" id="m-coral" aria-label="溫暖柔和版"></section></div>
    <div class="col off" data-col="ink"><p class="mock-name">簡潔工具感（Ink）</p><section class="mock ink" id="m-ink" aria-label="簡潔工具感版"></section></div>
    <div class="col off" data-col="hum"><p class="mock-name">活潑（Hum）</p><section class="mock hum" id="m-hum" aria-label="活潑版"></section></div>
  </div>
</div>

<script>
const CAP = 60;
const WEEK = [['一',35,10],['二',50,0],['三',20,25],['四',45,15],['五',40,20],['六',55,30]];
const BASE_LOG = [
  ['今天 02:16','爸爸','把時間設成 60 分'],
  ['今天 01:38','爸爸','加 30 分'],
  ['昨天 21:40','電視','時間用完，鎖住 YouTube 和 Netflix'],
  ['昨天 21:35','電視','剩 5 分，跳出提醒'],
  ['昨天 19:02','媽媽','加 30 分'],
  ['昨天 19:00','爸爸','加 15 分']
];
const S = { mode: 'open', used: [18, 4], bal: 38, pending: 0, confirm: '', note: '', log: [] };
let timer = 0;

function today() { return S.used; }
function week() { const t = today(); return WEEK.map(r => r.slice()).concat([['今天', t[0], t[1]]]); }
function sum(rows) { return rows.reduce((a, r) => [a[0] + r[1], a[1] + r[2]], [0, 0]); }
function hm(m) { return m >= 60 ? Math.floor(m / 60) + ' 小時' + (m % 60 ? ' ' + (m % 60) + ' 分' : '') : m + ' 分'; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }
function logRows() { return S.log.concat(BASE_LOG); }
function status() {
  if (S.mode === 'lost') return { tag: '未知', line: '電視 35 分鐘前回報', alert: '電視超過 30 分鐘沒回報，可能關機、斷網或 App 被關掉。' };
  if (S.mode === 'done') return { tag: '已鎖', line: '時間用完，YouTube 和 Netflix 已鎖', alert: '' };
  return { tag: '開放中', line: '電視在線，1 分鐘前回報', alert: '' };
}
function pendLine() { return S.pending ? '待電視接收 ' + S.pending + ' 分' : ''; }

function chart() {
  const rows = week(), max = 90;
  const grid = [30, 60, 90].map(v => '<span class="grid" style="bottom:' + (v / max * 100) + '%"></span>').join('');
  const axis = [0, 30, 60, 90].map(v => '<span style="bottom:' + (v / max * 100) + '%">' + v + '</span>').join('');
  const bars = rows.map(r => '<div class="bar" role="img" aria-label="' + r[0] + '：YouTube ' + r[1] + ' 分，Netflix ' + r[2] + ' 分"><i class="yt" style="height:' + (r[1] / max * 100) + '%"></i><i class="nf" style="height:' + (r[2] / max * 100) + '%"></i></div>').join('');
  const days = rows.map(r => '<span' + (r[0] === '今天' ? ' class="today"' : '') + '>' + r[0] + '</span>').join('');
  return '<div class="chart"><div class="axis" aria-hidden="true">' + axis + '</div><div class="plot">' + grid + bars + '</div><div class="days" aria-hidden="true">' + days + '</div></div>' +
    '<div class="legend"><span><i class="yt"></i>YouTube</span><span><i class="nf"></i>Netflix</span><span>單位：分</span></div>';
}
function acts(cls, extra) {
  const dis = S.pending ? ' disabled' : '';
  return [15, 30, 60].map(n => '<button type="button" class="' + cls + (extra && n === 30 ? ' ' + extra : '') + '" data-act="add" data-min="' + n + '"' + dis + '>+' + n + ' 分</button>').join('');
}
function zero(linkCls, okCls, wrapCls) {
  if (S.confirm) return '<div class="' + wrapCls + '"><span>確定把剩餘時間歸零？電視會馬上鎖住。</span><span style="display:flex;gap:10px"><button type="button" class="' + okCls + '" data-act="zero-ok">歸零</button><button type="button" class="' + linkCls + '" data-act="zero-no">取消</button></span></div>';
  return '<div class="' + wrapCls + '"><span>' + (S.note ? '' : '想讓他現在就停？') + '</span><button type="button" class="' + linkCls + '" data-act="zero">歸零</button></div>';
}
function logList(cls, moreCls, n) {
  const rows = logRows(), li = r => '<li><time>' + esc(r[0]) + '</time><span><b>' + esc(r[1]) + '</b> ' + esc(r[2]) + '</span></li>';
  return '<ul class="' + cls + '">' + rows.slice(0, n).map(li).join('') + '</ul>' +
    (rows.length > n ? '<details class="' + moreCls + '"><summary>看全部紀錄（' + rows.length + ' 筆）</summary><ul class="' + cls + '">' + rows.slice(n).map(li).join('') + '</ul></details>' : '');
}

const VIEWS = {
  coral() {
    const st = status(), t = today(), w = sum(week());
    return '<div class="c-desk"><div class="c-top"><b>看電視時間</b><span>範例資料</span></div>' +
      '<div class="c-sheet"><p class="c-lab">今天還剩</p><p class="c-big"><span class="n">' + S.bal + '</span><span class="u">分</span></p>' +
      '<p class="c-line">' + st.line + '</p>' + (S.pending ? '<p class="c-line">' + pendLine() + '</p>' : '') +
      (S.mode === 'done' ? '<p class="c-stamp" aria-hidden="true">已鎖</p>' : '') + '</div>' +
      (st.alert ? '<p class="c-alert">' + st.alert + '</p>' : '') +
      '<div class="c-acts">' + acts('c-btn') + '</div>' + (S.note ? '<p class="note">' + S.note + '</p>' : '') +
      zero('c-link', 'c-ink-btn', 'c-zero') + '</div>' +
      '<div class="c-body"><section><h2 class="c-h">使用時間</h2><dl class="c-sum">' +
      '<div><dt>今天</dt><dd>YouTube ' + t[0] + ' 分、Netflix ' + t[1] + ' 分</dd><span class="t">' + (t[0] + t[1]) + ' 分</span></div>' +
      '<div><dt>本週</dt><dd>YouTube ' + hm(w[0]) + '、Netflix ' + hm(w[1]) + '</dd><span class="t">' + hm(w[0] + w[1]) + '</span></div>' +
      '<div><dt>本月</dt><dd>YouTube 14 小時、Netflix 5 小時</dd><span class="t">19 小時</span></div></dl></section>' +
      '<section><h2 class="c-h">這 7 天</h2>' + chart() + '</section>' +
      '<section><h2 class="c-h">紀錄</h2>' + logList('c-log', 'c-more', 4) + '</section>' +
      '<p class="c-me">目前登入：爸爸</p></div>';
  },
  ink() {
    const st = status(), t = today(), w = sum(week());
    const tag = S.mode === 'open' ? 'tag--in' : S.mode === 'done' ? 'tag--on' : 'tag--out';
    return '<div class="i-top"><b>看電視時間</b><span>範例資料</span></div><div class="i-body">' +
      '<section class="i-now"><div class="i-row"><p class="i-lab">今天還剩</p><span class="tag ' + tag + '">YouTube／Netflix ' + st.tag + '</span></div>' +
      '<p class="i-big' + (S.mode === 'open' ? ' open' : '') + '"><span class="n">' + S.bal + '</span><span class="u">分</span></p>' +
      '<p class="i-meta">' + st.line + '</p>' + (S.pending ? '<p class="i-meta">' + pendLine() + '</p>' : '') +
      (st.alert ? '<p class="i-alert">' + st.alert + '</p>' : '') + '</section>' +
      '<section style="display:grid;gap:8px"><div class="i-acts">' + acts('i-btn', 'i-btn--primary') + '</div>' + (S.note ? '<p class="note">' + S.note + '</p>' : '') +
      zero('i-link', 'i-btn i-btn--primary', 'i-zero') + '</section>' +
      '<section><h2 class="i-h">使用時間</h2><table class="i-table"><thead><tr><th scope="col"><span class="vh">期間</span></th><th scope="col">YouTube</th><th scope="col">Netflix</th><th scope="col">合計</th></tr></thead><tbody>' +
      '<tr><th scope="row">今天</th><td>' + t[0] + ' 分</td><td>' + t[1] + ' 分</td><td>' + (t[0] + t[1]) + ' 分</td></tr>' +
      '<tr><th scope="row">本週</th><td>' + (w[0] / 60).toFixed(1) + ' 時</td><td>' + (w[1] / 60).toFixed(1) + ' 時</td><td>' + ((w[0] + w[1]) / 60).toFixed(1) + ' 時</td></tr>' +
      '<tr><th scope="row">本月</th><td>14.0 時</td><td>5.0 時</td><td>19.0 時</td></tr></tbody></table></section>' +
      '<section><h2 class="i-h">這 7 天</h2>' + chart() + '</section>' +
      '<section><h2 class="i-h">紀錄</h2>' + logList('i-log', 'i-more', 4) + '</section>' +
      '<p class="i-me">目前登入：爸爸</p></div>';
  },
  hum() {
    const st = status(), t = today(), w = sum(week());
    const cls = S.mode === 'done' ? ' done' : S.mode === 'lost' ? ' lost' : '';
    const lab = S.mode === 'done' ? '時間到了' : '今天還剩';
    return '<div class="h-top"><b>看電視時間</b><span>範例資料</span></div>' +
      '<div class="h-field' + cls + '" style="clip-path:' + torn() + '"><p class="h-lab">' + lab + '</p><p class="h-big"><span class="n">' + S.bal + '</span><span class="u">分</span></p>' +
      '<p class="h-line">' + st.line + '</p>' + (S.pending ? '<p class="h-line">' + pendLine() + '</p>' : '') + '</div>' +
      '<div class="h-body">' + (st.alert ? '<p class="h-alert">' + st.alert + '</p>' : '') +
      '<section style="display:grid;gap:8px"><div class="h-acts">' + acts('h-btn') + '</div>' + (S.note ? '<p class="note">' + S.note + '</p>' : '') +
      zero('h-link', 'h-btn h-btn--card', 'h-zero') + '</section>' +
      '<section class="h-meter"><h2 class="h-h">今天看了 ' + (t[0] + t[1]) + ' 分</h2>' +
      '<div class="h-track" role="img" aria-label="今天 YouTube ' + t[0] + ' 分，Netflix ' + t[1] + ' 分，以 60 分為滿"><i class="yt" style="width:' + Math.min(100, t[0] / CAP * 100) + '%"></i><i class="nf" style="width:' + Math.min(100, t[1] / CAP * 100) + '%"></i></div>' +
      '<p>YouTube ' + t[0] + ' 分、Netflix ' + t[1] + ' 分（滿格 60 分）</p></section>' +
      '<div class="h-pills"><div class="h-pill"><span>今天</span><b>' + (t[0] + t[1]) + '</b><small>分</small></div><div class="h-pill"><span>本週</span><b>' + ((w[0] + w[1]) / 60).toFixed(1) + '</b><small>小時</small></div><div class="h-pill"><span>本月</span><b>19</b><small>小時</small></div></div>' +
      '<section><h2 class="h-h">這 7 天</h2>' + chart() + '</section>' +
      '<section><h2 class="h-h">紀錄</h2>' + logList('h-log', 'h-more', 4) + '</section>' +
      '<p class="h-me">目前登入：爸爸</p></div>';
  }
};
function torn() {
  let x = 0, pts = ['0 0', '100% 0'], seed = 7;
  const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const out = [];
  while (x < 100) { out.push(x.toFixed(1) + '% calc(100% - ' + (4 + rnd() * 12).toFixed(1) + 'px)'); x += 3 + rnd() * 5; }
  out.push('100% calc(100% - 8px)');
  return 'polygon(' + pts.concat(out.reverse()).join(',') + ')';
}
function render(focus) {
  for (const k in VIEWS) document.getElementById('m-' + k).innerHTML = VIEWS[k]();
  if (focus) { const el = document.querySelector(focus); if (el) el.focus(); }
}
function setPressed(group, attr, val) { for (const b of document.querySelectorAll('#' + group + ' button')) b.setAttribute('aria-pressed', String(b.dataset[attr] === val)); }

document.getElementById('modes').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  clearTimeout(timer); S.mode = b.dataset.mode; S.pending = 0; S.confirm = ''; S.note = ''; S.log = [];
  S.bal = S.mode === 'done' ? 0 : 38; S.used = S.mode === 'done' ? [45, 15] : [18, 4];
  setPressed('modes', 'mode', S.mode); render();
});
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  for (const c of document.querySelectorAll('.col')) c.classList.toggle('off', c.dataset.col !== b.dataset.tab);
  setPressed('tabs', 'tab', b.dataset.tab);
});
document.querySelector('.mocks').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b || b.disabled) return;
  const m = b.closest('.mock').id, act = b.dataset.act;
  if (act === 'add') {
    const n = +b.dataset.min;
    S.pending = n; S.note = ''; S.confirm = '';
    S.log.unshift(['剛剛', '爸爸', '加 ' + n + ' 分']);
    render('#' + m + ' [data-act="add"][data-min="' + n + '"]');
    clearTimeout(timer);
    timer = setTimeout(() => {
      const want = S.bal + S.pending; S.bal = Math.min(CAP, want); S.pending = 0;
      S.note = want > CAP ? '最多 60 分，已補到 60 分。' : '電視已收到。';
      if (S.mode === 'done' && S.bal > 0) { S.mode = 'open'; setPressed('modes', 'mode', 'open'); }
      render('#' + m + ' [data-act="add"][data-min="' + n + '"]');
    }, 2000);
  } else if (act === 'zero') { S.confirm = 'y'; render('#' + m + ' [data-act="zero-ok"]'); }
  else if (act === 'zero-no') { S.confirm = ''; render('#' + m + ' [data-act="zero"]'); }
  else if (act === 'zero-ok') {
    S.confirm = ''; S.bal = 0; S.mode = 'done'; S.note = '已歸零，電視會馬上鎖住。';
    S.log.unshift(['剛剛', '爸爸', '歸零']); setPressed('modes', 'mode', 'done');
    render('#' + m + ' [data-act="zero"]');
  }
});
render();
</script>
